name: Weekly model retraining
on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC
  workflow_dispatch: {}       # lets you also run it manually (Actions tab -> Run workflow)
permissions:
  contents: write
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python retrain_local.py
      - name: Commit updated model
        run: |
          git config user.name "retrain-bot"; git config user.email "bot@users.noreply.github.com"
          git add outputs/attrition_model.joblib outputs/model_meta.json
          git diff --staged --quiet || git commit -m "Weekly retrain" && git push
